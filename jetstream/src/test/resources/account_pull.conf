# Cross account JetStream, set up for PULL delivery only.
#
# A pull request is a service request whose answer is many messages on the reply subject, so the api
# has to be exported with a stream response. The default singleton response would let exactly one
# message through. That export is what carries pull delivery.
#
# The inbox stream export is deliberately absent, so push delivery cannot arrive here. See
# account_push.conf for the push shape. An account that serves both needs both exports.

port: 0

jetstream: {max_mem_store: 1GB, max_file_store: 1GB}

accounts: {
  SOURCE: {
    jetstream: enabled
    users: [ {user: src, password: spass} ]
    exports [
        { service: "$JS.API.>", response_type: Stream },
    ]
  },
  TARGET: {
    jetstream: enabled
    users: [ {user: tar, password: tpass} ]
    imports [
      { service: { account: SOURCE, subject: "$JS.API.>" } , to: tar.api.> }
    ]
  }
}
