# Cross account JetStream, set up for PUSH delivery only.
#
# A push consumer's deliver subject is the client's own inbox, which JetStream publishes to inside
# the stream's account, so the inbox has to be exported as a stream for it to reach the importing
# account. That export is what carries push delivery.
#
# The api service export is left at the default singleton response, which is correct for the request
# and reply calls (create consumer, consumer info) but delivers only the first message of a pull
# request's answer. See account_pull.conf for the pull shape.

port: 0

jetstream: {max_mem_store: 1GB, max_file_store: 1GB}

accounts: {
  SOURCE: {
    jetstream: enabled
    users: [ {user: src, password: spass} ]
    exports [
        { service: "$JS.API.>" },
        { stream: "_INBOX.>" },
    ]
  },
  TARGET: {
    jetstream: enabled
    users: [ {user: tar, password: tpass} ]
    imports [
      { service: { account: SOURCE, subject: "$JS.API.>" } , to: tar.api.> }
      { stream: { account: SOURCE, subject: "_INBOX.>" }, to: "_INBOX.>" }
    ]
  }
}
