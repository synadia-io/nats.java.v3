# The kv_account.conf shape, with the api exported as a stream response so a pull consumer works.
# A pull request is answered with many messages on one reply subject and the default singleton
# response permits one, which makes a simplified consume see one entry and then nothing.

jetstream: enabled
accounts: {
    A: {
        jetstream: enabled
        users: [ {user: a, password: a} ]
        exports: [
            {service: '$JS.API.>', response_type: Stream}
            {service: '$KV.>'}
            {stream: "ForI.>"}
        ]
    },
    I: {
        users: [ {user: i, password: i} ]
        imports: [
            {service: {account: A, subject: '$JS.API.>'}, to: 'FromA.>' }
            {service: {account: A, subject: '$KV.>'}, to: 'FromA.$KV.>' }
            {stream:  {subject: "ForI.>", account: "A" } }
        ]
    }
}
