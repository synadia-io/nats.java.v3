// ---------------------------------------------------------------------------
// Subproject-specific identity — read by root build.gradle via afterEvaluate
// ---------------------------------------------------------------------------
ext {
    jarVersion        = '3.0.0'
    artifactNameExt   = 'jnats3-js'
    moduleNameExt     = 'io.synadia.jnats3.js'
    bundleNameExt     = 'io.synadia.jnats3.js'
    pomDescriptionExt = 'JetStream library for the NATS messaging system.'
    projectUrlExt     = 'https://github.com/synadia-io/nats.java.v3'
}

// ---------------------------------------------------------------------------
// Subproject-specific dependencies
// ---------------------------------------------------------------------------
dependencies {
    api project(':core')
    testImplementation project(path: ':core', configuration: 'testOutput')
}

// ---------------------------------------------------------------------------
// Subproject-specific javadoc config
// ---------------------------------------------------------------------------
javadoc {
    options.overview = 'src/main/javadoc/overview.html'
    options.memberLevel = JavadocMemberLevel.PUBLIC
    source = sourceSets.main.allJava
    title = "SYNADIA.IO JetStream API"
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('testJar', Jar) {
    archiveClassifier.set('tests')
    from sourceSets.test.output
}

configurations {
    testOutput
}

artifacts {
    testOutput testJar
}

// OSGi: a fragment of the core bundle, loaded by core's class loader, because it shares the
// io.synadia.client.api / impl / utils packages with core and uses their package-private members.
// Its classes are reached through the core bundle's exports of those packages.
jar {
    bundle {
        bnd('Fragment-Host': 'jnats3-core',
            'Import-Package': '!io.synadia.client.*, *')
    }
}
