// ---------------------------------------------------------------------------
// Subproject-specific identity — read by root build.gradle via afterEvaluate
// ---------------------------------------------------------------------------
ext {
    jarVersion        = '3.0.0'
    artifactNameExt   = 'jnats3-examples'
    moduleNameExt     = 'io.synadia.jnats3.examples'
    bundleNameExt     = 'io.synadia.jnats3.examples'
    pomDescriptionExt = 'Examples for the NATS messaging system client.'
    projectUrlExt     = 'https://github.com/synadia-io/nats.java.v3'
}

// ---------------------------------------------------------------------------
// Subproject-specific dependencies
// ---------------------------------------------------------------------------
dependencies {
    api project(':jetstream')  // transitively pulls :core
    api project(':service')
    implementation project(':kv')
    implementation project(':os')
    testImplementation project(path: ':core', configuration: 'testOutput')
}
