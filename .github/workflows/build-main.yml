name: Build Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-modules.yml
    with:
      base: ${{ github.event.before }}
      publish: true
      # a manual run on a branch other than main publishes a branch-specific snapshot
      branch: ${{ github.ref_name != 'main' && github.ref_name || '' }}
    secrets: inherit
