plugins {
    // nexusPublishing is ROOT ONLY - must not be in subprojects {}
    id("io.github.gradle-nexus.publish-plugin")

    // All others declared here so Gradle can resolve them, but applied per-subproject
    id("biz.aQute.bnd.builder") apply false
    id("org.gradle.test-retry") apply false
}

// ---------------------------------------------------------------------------
// Environment / build config — computed once at root, captured by subprojects
// These come from env vars so they are the same for every subproject
// ---------------------------------------------------------------------------
def isRelease       = System.getenv("BUILD_EVENT") == "release"
def brn             = System.getenv("BRANCH_REF_NAME")
def snap            = brn == null || brn.equals("") ? "-SNAPSHOT" : "." + brn + "-SNAPSHOT"

def tc              = System.getenv("TARGET_COMPATIBILITY")
def targetCompat    = tc == "25" ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21
def jarEnd          = tc == "25" ? "-jdk25" : ""

def os              = System.getProperty("os.name")
def javaVersion     = System.getProperty("java.version")

System.out.println("OS: " + os)
System.out.println("Java: " + javaVersion)
System.out.println("Target Compatibility: " + targetCompat)

// ---------------------------------------------------------------------------
// nexusPublishing — root level only, covers all subproject publications
// ---------------------------------------------------------------------------
nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = System.getenv('OSSRH_USERNAME')
            password = System.getenv('OSSRH_PASSWORD')
        }
    }
}

// ---------------------------------------------------------------------------
// Subproject config — everything that applies to all subprojects
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'jacoco'
    apply plugin: 'biz.aQute.bnd.builder'
    apply plugin: 'org.gradle.test-retry'
    apply plugin: 'signing'

    group = 'io.synadia'

    repositories {
        mavenCentral()
        maven { url = "https://repo1.maven.org/maven2/" }
        maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
    }

    // Shared test dependencies — every subproject uses these
    dependencies {
        testImplementation 'io.nats:jnats-server-runner:3.1.0'
        testImplementation 'nl.jqno.equalsverifier:equalsverifier:4.2.2'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.14.3'
    }

    // version.properties generation — safe outside afterEvaluate because
    // version is only read at execution time (inside doLast), not config time
    def generateVersionProps = tasks.register("generateVersionProperties") {
        def propsDir = layout.buildDirectory.dir("generated-resources/main")
        outputs.dir(propsDir)
        doLast {
            def f = propsDir.get().file("io/synadia/jnats3/version.properties").asFile
            f.parentFile.mkdirs()
            f.text = "version=${version}\n"
        }
    }

    sourceSets.main.resources.srcDir(generateVersionProps.map { it.outputs.files })

    tasks.register('javadocJar', Jar) {
        archiveClassifier.set('javadoc')
        from javadoc
    }

    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
        dependsOn("generateVersionProperties")
    }

    tasks.register('copyToLib', Copy) {
        into "build/libs"
        from configurations.runtimeClasspath
    }

    tasks.register('uberJar', Jar) {
        archiveClassifier = 'uber'
        from sourceSets.main.output
        dependsOn configurations.runtimeClasspath
        from {
            configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
        }
        exclude('META-INF/**')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        dependsOn copyToLib
    }

	artifacts {
		archives javadocJar, sourcesJar
	}

    test {
        useJUnitPlatform()
        maxHeapSize = "2g"
        testLogging {
            exceptionFormat = 'full'
            events "started", "passed", "skipped", "failed"
            showStandardStreams = true
        }
        retry {
            failOnPassedAfterRetry = false
            maxFailures = 4
            maxRetries = 4
        }
        int mpf = Math.max(1, (int)(Runtime.runtime.availableProcessors() * 3 / 4))
        maxParallelForks = Math.min(6, mpf)
        systemProperty 'junit.jupiter.execution.timeout.default', '3m'
        systemProperty 'nkey.provider.class', 'io.nats.nkey.LtsNKeyProvider'
    }

    jacoco {
        toolVersion = "0.8.12"
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
        afterEvaluate { // only report on main library not examples
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it,
                        exclude: ['**/Debug**'])
            }))
        }
    }

    // -------------------------------------------------------------------------
    // afterEvaluate — deferred until the subproject's build.gradle has run,
    // so that ext.jarVersion and other ext vars are guaranteed to exist
    // -------------------------------------------------------------------------
    afterEvaluate {
        def jarAndArtifactName = "jnats3" + jarEnd

        version = isRelease ? jarVersion : jarVersion + snap

        System.out.println("Output: " + group + ":" + jarAndArtifactName + ":" + version)

        java {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = targetCompat
        }

        jar {
            manifest {
                attributes('Automatic-Module-Name': moduleNameExt)
            }
            bundle {
                bnd("Bundle-Name": bundleNameExt,
                    "Bundle-Vendor": "synadia.io",
                    "Bundle-Description": pomDescriptionExt,
                    "Bundle-DocURL": projectUrlExt
                )
            }
            archiveBaseName = jarAndArtifactName
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    artifact sourcesJar
                    artifact javadocJar
                    pom {
                        name = jarAndArtifactName
                        packaging = "jar"
                        groupId = group
                        artifactId = jarAndArtifactName
                        description = pomDescriptionExt
                        url = projectUrlExt
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        developers {
                            developer {
                                id = "synadia"
                                name = "Synadia"
                                email = "info@synadia.com"
                                url = "https://synadia.io"
                            }
                        }
                        scm {
                            url = projectUrlExt
                        }
                    }
                }
            }
        }

        if (isRelease) {
            signing {
                def signingKeyId = System.getenv('SIGNING_KEY_ID')
                def signingKey = System.getenv('SIGNING_KEY')
                def signingPassword = System.getenv('SIGNING_PASSWORD')
                useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
                sign configurations.archives
                sign publishing.publications.mavenJava
            }
        }
    }
}
