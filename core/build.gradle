// ---------------------------------------------------------------------------
// Subproject-specific identity — read by root build.gradle via afterEvaluate
// ---------------------------------------------------------------------------
ext {
    jarVersion        = '3.0.0'
    moduleNameExt     = 'io.synadia.jnats3.core'
    bundleNameExt     = 'io.synadia.jnats3.core'
    pomDescriptionExt = 'Core library for the NATS messaging system.'
    projectUrlExt     = 'https://github.com/synadia-io/nats.java.v3'
}

// ---------------------------------------------------------------------------
// Subproject-specific dependencies
// ---------------------------------------------------------------------------
dependencies {
    api 'org.bouncycastle:bcprov-lts8on:2.73.10'
    api 'org.jspecify:jspecify:1.0.0'
}

tasks.register('testJar', Jar) {
    archiveClassifier.set('tests')
    from sourceSets.test.output
}

configurations {
    testOutput
}

artifacts {
    testOutput testJar
}

// ---------------------------------------------------------------------------
// Subproject-specific javadoc config
// ---------------------------------------------------------------------------
javadoc {
    options.overview = 'src/main/javadoc/overview.html'
    options.memberLevel = JavadocMemberLevel.PUBLIC
    source = sourceSets.main.allJava
    title = "SYNADIA.IO Core API"
    excludes = [
        "io/synadia/jnats3/core/impl",
        "io/synadia/jnats3/core/support/**",
        "**/Debug**"
    ]
    classpath = sourceSets.main.runtimeClasspath
}
