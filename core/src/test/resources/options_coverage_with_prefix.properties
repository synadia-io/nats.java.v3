# All keys have prefix "io.nats.client."
# All keys in camelCase format
io.nats.client.connectionName=name
io.nats.client.credentialPath=src/test/resources/jwt_nkey/test.creds
io.nats.client.username=user
io.nats.client.maxReconnect=10
io.nats.client.maxMessagesInOutgoingQueue=11
io.nats.client.reconnectBufSize=2999999999
io.nats.client.pingInterval=1000
io.nats.client.ignoreDiscoveredServers=true
io.nats.client.serversPoolImplementationClass=io.synadia.client.utils.CoverageServerPool
