// ---------------------------------------------------------------------------
// Subproject-specific identity — read by root build.gradle via afterEvaluate
// ---------------------------------------------------------------------------
ext {
    jarVersion        = '3.0.0'
    artifactNameExt   = 'jnats3-ljs'
    moduleNameExt     = 'io.synadia.jnats3.ljs'
    bundleNameExt     = 'io.synadia.jnats3.ljs'
    pomDescriptionExt = 'Legacy JetStream behaviors for the NATS messaging system.'
    projectUrlExt     = 'https://github.com/synadia-io/nats.java.v3'
}

// ---------------------------------------------------------------------------
// Subproject-specific dependencies
// ---------------------------------------------------------------------------
dependencies {
    api project(':jetstream')  // transitively pulls :core
    testImplementation project(path: ':core', configuration: 'testOutput')
    testImplementation project(path: ':jetstream', configuration: 'testOutput')
}

// ---------------------------------------------------------------------------
// Subproject-specific javadoc config
// ---------------------------------------------------------------------------
javadoc {
    options.memberLevel = JavadocMemberLevel.PUBLIC
    source = sourceSets.main.allJava
    title = "SYNADIA.IO Legacy JetStream API"
    classpath = sourceSets.main.runtimeClasspath
}

// OSGi: a fragment of the core bundle, like jetstream, because it shares the io.synadia.client.impl
// package with core and jetstream and uses their package-private members.
jar {
    bundle {
        bnd('Fragment-Host': 'jnats3-core',
            'Import-Package': '!io.synadia.client.*, *')
    }
}
